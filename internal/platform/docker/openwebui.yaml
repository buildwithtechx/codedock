x-codedock:
  is_one_click: true
  name: Open WebUI
  description: User-friendly web interface for local LLMs and Ollama
  category: ai
  icon: open-webui
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - openwebui-data:/app/backend/data
volumes:
  openwebui-data:
