name: Auto PR to main when version changes

on:
  push:
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from package.json
        run: echo "VERSION=$(jq -r .version ./package.json)" >> $GITHUB_ENV

      - name: Get latest GitHub tag
        run: |
          LATEST_TAG=$(git ls-remote --tags origin | awk -F'/' '{print $3}' | grep -v '\^{}' | sort -V | tail -n1)
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
          echo "Latest Tag: $LATEST_TAG"

      - name: Compare versions
        run: |
          if [ "${{ env.VERSION }}" != "${{ env.LATEST_TAG }}" ]; then
            VERSION_CHANGED="true"
          else
            VERSION_CHANGED="false"
          fi
          echo "VERSION_CHANGED=$VERSION_CHANGED" >> $GITHUB_ENV
          echo "Comparing versions:"
          echo "Current version: ${{ env.VERSION }}"
          echo "Latest tag: ${{ env.LATEST_TAG }}"
          echo "Version changed: $VERSION_CHANGED"

      - name: Check if a PR already exists
        run: |
          PR_EXISTS=$(gh pr list --state open --base main --head dev --json number --jq '. | length')
          echo "PR_EXISTS=$PR_EXISTS" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        if: env.VERSION_CHANGED == 'true' && env.PR_EXISTS == '0'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout dev
          git push origin dev

          # Ensure labels exist before applying them
          gh label create "release" --color "0e8a16" --description "Release PR" 2>/dev/null || true
          gh label create "automated pr" --color "1d76db" --description "Automated pull request" 2>/dev/null || true

          PR_URL=$(gh pr create \
            --title "🚀 Release ${{ env.VERSION }}" \
            --body '
            This PR promotes changes from `dev` to `main` for version ${{ env.VERSION }}.

            ### 🔍 Changes Include:
            - Version bump to ${{ env.VERSION }}
            - All changes from dev branch

            ### ✅ Pre-merge Checklist:
            - [ ] All Go & Dashboard tests passing (`npm run test`)
            - [ ] Dashboard builds cleanly (`npm run build`)
            - [ ] Code formatted with `npm run fmt`

            > 🤖 This PR was automatically generated by [GitHub Actions](https://github.com/actions)' \
            --base main \
            --head dev 2>&1) || {
            echo "Auto PR creation skipped or not permitted by repo policy: $PR_URL"
            exit 0
          }

          echo "Created PR: $PR_URL"
          gh pr edit "$PR_URL" --add-label "release,automated pr" 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
