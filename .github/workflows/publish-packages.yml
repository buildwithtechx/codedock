name: Publish npm packages

on:
  workflow_dispatch:
  push:
    tags:
      - "packages-v*"
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test wrapper
        run: npm run test:wrapper

      - name: Test SDK
        run: npm test --workspace=@codedock/sdk

      - name: Verify package packaging and exports
        run: node scripts/verify-package.mjs

  publish:
    name: Publish packages to npm
    if: (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/packages-v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: |
          VERSION=$(node -p "require('./apps/cli/package.json').version")
          test "packages-v${VERSION}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != packages-v${VERSION}"; exit 1; }

      - name: Verify GitHub release exists for this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./apps/cli/package.json').version")
          gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null || { echo "Missing GitHub release v${VERSION}"; exit 1; }

      - name: Verify trusted publishing toolchain
        run: |
          node --version
          npm --version

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --provenance --access public --workspace=codedock

  publish-extension:
    name: Package and publish VS Code extension
    if: (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile and package extension
        run: |
          npm run build:extension
          npm run package:extension

      - name: Attach VSIX artifact to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VSIX_FILE=$(ls apps/extension/*.vsix | head -n 1)
          if [ -n "$VSIX_FILE" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ "$TAG" == packages-v* ]]; then
              RELEASE_TAG="v${TAG#packages-v}"
            else
              RELEASE_TAG="$TAG"
            fi
            gh release upload "$RELEASE_TAG" "$VSIX_FILE" --clobber || gh release upload "$TAG" "$VSIX_FILE" --clobber || true
          fi

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: |
          npx vsce publish --no-dependencies --pat "$VSCE_PAT"
        working-directory: apps/extension

