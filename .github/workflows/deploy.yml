name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to deploy (default: latest)"
        required: false
        default: "latest"

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/buildwithtechx/codedock

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}

  deploy:
    name: Deploy to app.codedock.dev
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
      url: https://app.codedock.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/opt/codedock"

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/codedock

            echo "→ Pulling image ${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}"
            CODEDOCK_VERSION=${{ needs.build-and-push.outputs.image_tag }} \
              docker compose -f docker-compose.prod.yml pull codedock

            echo "→ Starting services"
            CODEDOCK_VERSION=${{ needs.build-and-push.outputs.image_tag }} \
              docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "→ Cleaning up old images"
            docker image prune -f

            echo "→ Health check"
            sleep 10
            curl -fsSL https://app.codedock.dev/healthz || (docker compose -f docker-compose.prod.yml logs --tail=50 codedock && exit 1)

            echo "✅ Deployed ${{ needs.build-and-push.outputs.image_tag }} successfully"

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy]
    if: always()
    steps:
      - name: Deployment status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "✅ Production deployment succeeded — ${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}"
          else
            echo "❌ Production deployment failed"
            exit 1
          fi
