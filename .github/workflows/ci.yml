name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:dashboard
      - run: go vet ./...
      - run: go test -race ./...

  go-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codedock
          POSTGRES_PASSWORD: codedock
          POSTGRES_DB: codedock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codedock -d codedock_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      CODEDOCK_TEST_PG_URL: postgres://codedock:codedock@localhost:5432/codedock_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./internal/repositories/... ./internal/engine/systemdb/... ./cmd/...

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run typecheck
      - run: npm run build:dashboard
      - run: npm run build:cli
      - run: npm run typecheck:cli
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm run test

  websites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace=@codedock/web
      - run: npm run test --workspace=@codedock/web
      - run: npm run build:web
      - run: npm run build:docs
