name: Pull Request

on:
  pull_request:
    branches: [main, canary]

permissions:
  contents: read

jobs:
  pr-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        job: [build, test, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install Dependencies & Build GUI
        run: |
          npm ci
          npm run generate-routes
          npm run build:dashboard

      - name: Run Build
        if: matrix.job == 'build'
        run: npm run build:daemon

      - name: Run Tests
        if: matrix.job == 'test'
        run: go test -v -race ./...

      - name: Run Typecheck
        if: matrix.job == 'typecheck'
        run: npm run typecheck
