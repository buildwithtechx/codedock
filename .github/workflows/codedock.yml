name: Codedock Build & Release

on:
  push:
    tags:
      - "v*" # Trigger on tags like v1.0.0, v0.2.1, etc.

permissions:
  contents: write # Needed to create GitHub Releases

jobs:
  release-server-cli:
    name: Build & Release Server & CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install dependencies & build dashboard
        run: |
          npm ci
          npm run generate-routes
          npm run build:dashboard

      - name: Build and Package Binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist

          # 1. Build the server daemon (codedockd)
          for GOARCH in amd64 arm64; do
            echo "Building codedockd for linux/$GOARCH..."
            GOOS=linux GOARCH=$GOARCH go build -ldflags="-s -w -X main.codedockVersion=$VERSION" -o dist/codedockd_linux_$GOARCH ./cmd/codedockd
            tar -czf dist/codedockd_linux_$GOARCH.tar.gz -C dist codedockd_linux_$GOARCH
            rm dist/codedockd_linux_$GOARCH
          done

          # 2. Build the remote client CLI (codedock)
          # macOS
          for GOARCH in amd64 arm64; do
            echo "Building codedock for darwin/$GOARCH..."
            GOOS=darwin GOARCH=$GOARCH go build -ldflags="-s -w -X main.version=$VERSION" -o dist/codedock ./cmd/codedock
            tar -czf dist/codedock_darwin_$GOARCH.tar.gz -C dist codedock
            rm dist/codedock
          done

          # Linux
          for GOARCH in amd64 arm64; do
            echo "Building codedock for linux/$GOARCH..."
            GOOS=linux GOARCH=$GOARCH go build -ldflags="-s -w -X main.version=$VERSION" -o dist/codedock ./cmd/codedock
            tar -czf dist/codedock_linux_$GOARCH.tar.gz -C dist codedock
            rm dist/codedock
          done

          # Windows
          for GOARCH in amd64 arm64; do
            echo "Building codedock for windows/$GOARCH..."
            GOOS=windows GOARCH=$GOARCH go build -ldflags="-s -w -X main.version=$VERSION" -o dist/codedock.exe ./cmd/codedock
            zip -j dist/codedock_windows_$GOARCH.zip dist/codedock.exe
            rm dist/codedock.exe
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

  release-desktop:
    name: Build Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install WebKit & RPM build dependencies (Linux for Debian/Ubuntu/Fedora)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: Install dependencies & Build Dashboard
        run: |
          npm ci
          npm run build:dashboard

      - name: Build Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Codedock Desktop ${{ github.ref_name }}'
